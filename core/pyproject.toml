[project]
name = "pska-core"
version = "0.1.0"
description = "PSKA core storage, ACL, memory, hypergraph, and retrieval services."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
documents = [
  "pypdf>=5.0.0",
  "python-docx>=1.1.0",
]
watch = [
  "watchdog>=4.0.0",
]
retrieval = [
  "rank-bm25>=0.2.2",
  "rapidfuzz>=3.9.0",
]
embeddings = [
  "torch>=2.0",
  "transformers>=4.44.2,<5",
  "datasets>=2.19.0",
  "accelerate>=0.20.1",
  "sentence-transformers",
  "peft",
  "sentencepiece",
  "protobuf",
  "numpy<2",
]

[project.scripts]
pska-core = "pska_core.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
