# Legacy PSKA Core TOML example.
# Current PSKA service/gateway runtime uses JSON config at .pska/config.json.
# Keep this file only as a historical/privacy-check fixture; do not copy it
# for new PSKA deployments.
# Do not commit real names, secrets, private aliases, or machine-specific paths.

[database]
url = "postgresql://pska:pska@localhost:5432/pska"

[storage]
archive_root = "archive"

[defaults]
owner_user_id = "user_primary"
private_space_id = "private_primary"
review_space_id = "system_review"
agent_space_id = "agent_workspace"
team_shared_space_id = "team_shared_default"

[embedding]
provider = "bge-m3"
model = "BAAI/bge-m3"
dimensions = 1024
batch_size = 16
# For API-backed embeddings, set provider = "api", use an OpenAI-compatible
# embeddings endpoint, and provide credentials via api_key_file or env.
api_key_file = ""
base_url = "https://api.openai.com/v1"
timeout_seconds = 60

[ingest]
chunk_size = 1200
chunk_overlap = 0
