<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PSKA Twitter Archive</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <h1>PSKA Archive</h1>
        <p>Save Twitter/X posts from this Chrome session.</p>
      </header>

      <button id="archive-current" type="button">Archive current Tweet</button>

      <section>
        <label for="batch-urls">Batch URLs</label>
        <textarea id="batch-urls" spellcheck="false" placeholder="https://x.com/user/status/123&#10;https://twitter.com/user/status/456"></textarea>
        <button id="archive-batch" type="button">Archive batch</button>
      </section>

      <pre id="status" aria-live="polite"></pre>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
